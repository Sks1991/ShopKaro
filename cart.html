<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ShopKaro - Cart</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <style>

        /* =========================================
           CART PAGE
           ========================================= */

        .cart-page {

            min-height: calc(100vh - 70px);

            padding: 60px 50px;

            background-color: #f5f7fa;

        }


        /* =========================================
           CART TITLE
           ========================================= */

        .cart-title {

            text-align: center;

            margin-bottom: 40px;

        }


        .cart-title h1 {

            font-size: 36px;

            color: #222;

            margin-bottom: 8px;

        }


        .cart-title p {

            color: #666;

        }


        /* =========================================
           CART CONTAINER
           ========================================= */

        .cart-container {

            max-width: 1100px;

            margin: 0 auto;

            display: grid;

            grid-template-columns: 1fr 320px;

            gap: 30px;

            align-items: start;

        }


        /* =========================================
           CART ITEMS
           ========================================= */

        .cart-items {

            background-color: white;

            border-radius: 12px;

            padding: 25px;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.08);

        }


        .cart-item {

            display: grid;

            grid-template-columns:
                100px 1fr auto;

            gap: 20px;

            align-items: center;

            padding: 20px 0;

            border-bottom: 1px solid #eee;

        }


        .cart-item:last-child {

            border-bottom: none;

        }


        /* =========================================
           PRODUCT IMAGE
           ========================================= */

        .cart-item-image {

            width: 100px;

            height: 100px;

            background-color: #f0f5fb;

            border-radius: 8px;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

        }


        .cart-item-image img {

            width: 100%;

            height: 100%;

            object-fit: contain;

        }


        /* =========================================
           PRODUCT INFORMATION
           ========================================= */

        .cart-item-info h3 {

            font-size: 18px;

            margin-bottom: 7px;

            color: #222;

        }


        .cart-item-price {

            color: #007bff;

            font-weight: bold;

            margin-bottom: 12px;

        }


        /* =========================================
           QUANTITY
           ========================================= */

        .cart-quantity {

            display: flex;

            align-items: center;

            width: fit-content;

            border: 1px solid #ddd;

            border-radius: 5px;

            overflow: hidden;

        }


        .cart-quantity button {

            width: 34px;

            height: 34px;

            border: none;

            background-color: #f1f1f1;

            cursor: pointer;

            font-size: 18px;

        }


        .cart-quantity button:hover {

            background-color: #ddd;

        }


        .cart-quantity span {

            width: 40px;

            text-align: center;

            font-weight: bold;

        }


        /* =========================================
           ITEM TOTAL
           ========================================= */

        .cart-item-total {

            text-align: right;

            font-weight: bold;

            font-size: 17px;

            color: #222;

        }


        /* =========================================
           REMOVE BUTTON
           ========================================= */

        .remove-btn {

            display: block;

            margin-top: 10px;

            padding: 0;

            border: none;

            background: none;

            color: #dc3545;

            cursor: pointer;

            font-size: 13px;

        }


        .remove-btn:hover {

            text-decoration: underline;

        }


        /* =========================================
           ORDER SUMMARY
           ========================================= */

        .cart-summary {

            background-color: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.08);

            position: sticky;

            top: 90px;

        }


        .cart-summary h2 {

            margin-bottom: 20px;

            color: #222;

        }


        .summary-row {

            display: flex;

            justify-content: space-between;

            margin-bottom: 12px;

            color: #555;

        }


        .summary-total {

            border-top: 1px solid #ddd;

            padding-top: 15px;

            margin-top: 15px;

            font-size: 20px;

            font-weight: bold;

            color: #222;

        }


        /* =========================================
           CHECKOUT
           ========================================= */

        .checkout-btn {

            width: 100%;

            margin-top: 20px;

            padding: 13px;

            border: none;

            border-radius: 6px;

            background-color: #28a745;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        .checkout-btn:hover {

            background-color: #218838;

        }


        .continue-btn {

            display: block;

            text-align: center;

            margin-top: 15px;

            color: #007bff;

            text-decoration: none;

            font-size: 14px;

        }


        .continue-btn:hover {

            text-decoration: underline;

        }


        /* =========================================
           EMPTY CART
           ========================================= */

        .empty-cart {

            text-align: center;

            padding: 60px 20px;

        }


        .empty-cart-icon {

            font-size: 60px;

            margin-bottom: 15px;

        }


        .empty-cart h2 {

            margin-bottom: 10px;

            color: #222;

        }


        .empty-cart p {

            color: #777;

        }


        .shop-products-btn {

            display: inline-block;

            margin-top: 20px;

            padding: 12px 25px;

            background-color: #007bff;

            color: white;

            text-decoration: none;

            border-radius: 6px;

            font-weight: bold;

        }


        .shop-products-btn:hover {

            background-color: #0056b3;

        }


        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 800px) {

            .cart-page {

                padding: 40px 15px;

            }


            .cart-container {

                grid-template-columns: 1fr;

            }


            .cart-summary {

                position: static;

            }


            .cart-item {

                grid-template-columns:
                    80px 1fr;

                gap: 15px;

            }


            .cart-item-image {

                width: 80px;

                height: 80px;

            }


            .cart-item-total {

                grid-column: 2;

                text-align: left;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVBAR
         ========================================= -->

    <header>

        <div class="logo">

            <a href="index.html">
                ShopKaro
            </a>

        </div>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="about.html">
                About
            </a>

            <a href="contact.html">
                Contact
            </a>

        </nav>


        <div class="cart">

            <a href="cart.html">

                Cart

                <span id="cart-count">
                    0
                </span>

            </a>

        </div>

    </header>



    <!-- =========================================
         CART
         ========================================= -->

    <main class="cart-page">


        <div class="cart-title">

            <h1>
                Shopping Cart
            </h1>

            <p>
                Review your products before checkout.
            </p>

        </div>


        <div
            id="cartContainer"
            class="cart-container"
        >

        </div>


    </main>



    <!-- =========================================
         FOOTER
         ========================================= -->

    <footer>

        <div class="footer-content">

            <h3>
                ShopKaro
            </h3>

            <p>
                Your trusted online shopping destination.
            </p>

            <p class="copyright">
                © 2026 ShopKaro. All Rights Reserved.
            </p>

        </div>

    </footer>



    <!-- CART JAVASCRIPT -->

    <script src="js/cart.js"></script>


</body>

</html>
