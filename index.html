<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopKaro - Online Shopping</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <header>

        <!-- Logo -->
        <div class="logo">
            <a href="index.html">
                <img src="images/logo.png" alt="ShopKaro Logo">
            </a>
        </div>


        <!-- Navigation Menu -->
        <nav>

            <a href="index.html">Home</a>

            <a href="products.html">Products</a>

            <a href="about.html">About</a>

            <a href="contact.html">Contact</a>

        </nav>


        <!-- Cart -->
        <div class="cart">

            <a href="cart.html">
                🛒 Cart
                <span id="cart-count">0</span>
            </a>

        </div>

    </header>



    <!-- ================= HERO SECTION ================= -->

    <section class="hero">

        <!-- Banner Image -->
        <img
            src="images/banner.jpg"
            alt="ShopKaro Shopping Banner"
        >


        <!-- Hero Content -->
        <div class="hero-content">

            <h1>
                Welcome to ShopKaro
            </h1>

            <p>
                Find the best products at the best prices.
            </p>

            <a href="products.html">
                <button>
                    Shop Now
                </button>
            </a>

        </div>

    </section>



    <!-- ================= PRODUCTS SECTION ================= -->

    <section class="products">

        <h2>
            Featured Products
        </h2>


        <div class="product-container">


            <!-- ================= PRODUCT 1 ================= -->

            <div class="product-card">

                <img
                    src="images/product1.jpg"
                    alt="Premium Product"
                >

                <h3>
                    Premium Product
                </h3>

                <p>
                    ₹999
                </p>

                <button onclick="addToCart()">
                    Add to Cart
                </button>

            </div>



            <!-- ================= PRODUCT 2 ================= -->

            <div class="product-card">

                <img
                    src="images/product2.jpg"
                    alt="Latest Product"
                >

                <h3>
                    Latest Product
                </h3>

                <p>
                    ₹1,499
                </p>

                <button onclick="addToCart()">
                    Add to Cart
                </button>

            </div>



            <!-- ================= PRODUCT 3 ================= -->

            <div class="product-card">

                <img
                    src="images/product1.jpg"
                    alt="Smart Product"
                >

                <h3>
                    Smart Product
                </h3>

                <p>
                    ₹1,999
                </p>

                <button onclick="addToCart()">
                    Add to Cart
                </button>

            </div>


        </div>

    </section>



    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © 2026 ShopKaro. All Rights Reserved.
        </p>

    </footer>



    <!-- ================= JAVASCRIPT ================= -->

    <script>

        // Cart Count
        let cartCount = 0;


        // Add Product To Cart
        function addToCart() {

            cartCount++;

            document.getElementById("cart-count").innerText = cartCount;

        }

    </script>


</body>

</html>
